document.addEventListener('click',e=>{
  const card=e.target.closest('[data-card]');
  if(card && S && S.game){
    const type=S.game.phase==='discard'?'discard':'play';
    send({t:'act',a:{type,card:card.dataset.card}}); return;
  }
  const b=e.target.closest('[data-do]'); if(!b||b.disabled) return;
  const d=b.dataset;
  switch(d.do){
    case 'sit': send({t:'sit',seat:+d.seat}); break;
    case 'stand': send({t:'stand'}); break;
    case 'bot': send({t:'bot',seat:+d.seat,on:d.on==='1'}); break;
    case 'start': send({t:'start'}); break;
    case 'newgame': send({t:'newgame'}); break;
    case 'lobby': send({t:'lobby'}); break;
    case 'speed': send({t:'speed',v:+d.v}); break;
    case 'react':
      if(d.big) send({t:'react',e:d.e,big:d.big}); else { send({t:'react',e:d.e}); rememberEmoji(d.e); }
      if(!d.keep) closePicker();                        // emoji grid stays open so you can send a few
      break;
    case 'picker': openPicker(b); break;
    case 'ptab': pickerTab = isNaN(+d.tab) ? d.tab : +d.tab; renderPickerTab(); break;
    case 'sendgif': send({t:'gif',url:d.url}); closePicker(); break;
    case 'themes': openThemeMenu(b); break;
    case 'theme': applyTheme(d.id); closeThemeMenu(); break;
    case 'mute': Sound.muted=!Sound.muted; store.set('euchre_mute',Sound.muted?'1':'0'); if(!Sound.muted){ Sound.init(); Sound.play('pop'); } render(); break;
    case 'pass': send({t:'act',a:{type:'pass'}}); goAlone=false; break;
    case 'order': send({t:'act',a:{type:'order',alone:goAlone}}); goAlone=false; break;
    case 'call': send({t:'act',a:{type:'call',suit:d.suit,alone:goAlone}}); goAlone=false; break;
  }
});

});

    <form id="gifPaste" class="prow"><input type="text" id="gifUrl" placeholder="…or paste a GIPHY / Tenor GIF link" autocomplete="off"><button>Send</button></form>
    <details class="pkey" ${key?'':'open'}><summary>${own?'Your GIPHY key is saved':'Add a GIPHY key'}</summary>
      <form id="gifKeyForm" class="prow"><input type="text" id="gifKeyIn" placeholder="GIPHY API key" autocomplete="off" value="${esc(own?store.get('euchre_giphy_key'):'')}"><button>Save</button></form>
      <div class="muted pnote">Free at developers.giphy.com. Saved in this browser only${S&&S.isHost?'; friends in your room can search with it too':''}.</div></details>`;
  if(key){ const i=$('#gifSearch'); i.focus(); i.oninput=()=>{ gifQuery=i.value; clearTimeout(gifTimer); gifTimer=setTimeout(loadGifs,350); }; loadGifs(); }
  $('#gifPaste').onsubmit=e=>{ e.preventDefault(); const u=$('#gifUrl').value;
    if(!cleanGifUrl(u)) return toast("That doesn't look like a GIPHY or Tenor GIF link — try “Copy image address”.");
    send({t:'gif',url:u}); closePicker(); };
  $('#gifKeyForm').onsubmit=e=>{ e.preventDefault(); const v=$('#gifKeyIn').value.trim();
    if(v && !/^[A-Za-z0-9]{16,64}$/.test(v)) return toast("That doesn't look like a GIPHY key");
    store.set('euchre_giphy_key',v); renderGifTab(body); if(role==='host' && room) room.broadcast(); };
}
async function loadGifs(){
  const out=$('#gifResults'); if(!out) return;
  const key=giphyKey(), seq=++gifSeq, q=gifQuery.trim();
  out.innerHTML='<div class="muted pnote">Loading…</div>';
  const url=q ? `https://api.giphy.com/v1/gifs/search?api_key=${encodeURIComponent(key)}&q=${encodeURIComponent(q)}&limit=24&rating=pg-13`
              : `https://api.giphy.com/v1/gifs/trending?api_key=${encodeURIComponent(key)}&limit=24&rating=pg-13`;
  try{
    const res=await fetch(url); if(seq!==gifSeq) return;
    if(res.status===401||res.status===403) throw new Error('GIPHY rejected that key');
    if(!res.ok) throw new Error('GIPHY error '+res.status);
    const data=(await res.json()).data||[];
    out.innerHTML=data.length ? data.map(g=>{
      const full=cleanGifUrl((g.images.fixed_height||g.images.original||{}).url), thumb=cleanGifUrl((g.images.fixed_height_small||g.images.fixed_height||{}).url);
      return full&&thumb ? `<button type="button" data-do="sendgif" data-url="${esc(full)}" title="${esc(g.title||'GIF')}"><img src="${esc(thumb)}" alt="${esc(g.title||'GIF')}" loading="lazy" referrerpolicy="no-referrer"></button>` : '';
    }).join('') : '<div class="muted pnote">No GIFs found.</div>';
  }catch(err){ if(seq===gifSeq) out.innerHTML=`<div class="pnote">${esc(err.message||'Could not reach GIPHY')}</div>`; }
}
document.addEventListener('click',e=>{ if(!e.target.closest('#picker,[data-do=picker]')) closePicker(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePicker(); });

/* ---- boot ---- */
renderReactbar();
$('#nameIn').value=store.get('euchre_name')||'';
const hashCode=(location.hash||'').replace('#','').toUpperCase();
if(hashCode.length===4) $('#codeIn').value=hashCode;
const savedRoom=store.sget('euchre_room');
if(savedRoom && $('#nameIn').value && savedRoom===hashCode) joinGame(savedRoom,true);
else if(hashCode.length===4) $('#nameIn').focus();
</script>
</body>
</html>
